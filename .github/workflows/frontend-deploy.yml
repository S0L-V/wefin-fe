name: Frontend Deploy

on:
  push:
    branches:
      - main
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set environment variables
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            API_URL="${{ secrets.PROD_API_URL }}"
            TOSS_CLIENT_KEY="${{ secrets.PROD_TOSS_CLIENT_KEY }}"
          else
            API_URL="${{ secrets.DEV_API_URL }}"
            TOSS_CLIENT_KEY="${{ secrets.DEV_TOSS_CLIENT_KEY }}"
          fi

          if [ -z "$API_URL" ]; then
            echo "ERROR: API_URL secret is missing for branch ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          if [ -z "$TOSS_CLIENT_KEY" ]; then
            echo "ERROR: TOSS_CLIENT_KEY secret is missing for branch ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          API_URL="${API_URL%/}"
          WS_ORIGIN="${API_URL%/api}"

          {
            echo "VITE_API_BASE_URL=$API_URL"
            echo "VITE_WS_URL=$WS_ORIGIN/ws"
            echo "VITE_TOSS_CLIENT_KEY=$TOSS_CLIENT_KEY"
          } > .env.production

      - name: Build
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Set deploy target
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "S3_BUCKET=wefin-fe-prod" >> $GITHUB_OUTPUT
            echo "CF_DISTRIBUTION_ID=${{ secrets.CF_DISTRIBUTION_ID_PROD }}" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=production" >> $GITHUB_OUTPUT
          else
            echo "S3_BUCKET=wefin-fe-dev" >> $GITHUB_OUTPUT
            echo "CF_DISTRIBUTION_ID=${{ secrets.CF_DISTRIBUTION_ID_DEV }}" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=development" >> $GITHUB_OUTPUT
          fi

      - name: Upload to S3
        run: |
          aws s3 sync dist/ s3://${{ steps.vars.outputs.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          aws s3 cp dist/index.html s3://${{ steps.vars.outputs.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.vars.outputs.CF_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deploy summary
        run: |
          echo "### Deployed to ${{ steps.vars.outputs.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "- S3 Bucket: \`${{ steps.vars.outputs.S3_BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- CloudFront: \`${{ steps.vars.outputs.CF_DISTRIBUTION_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
